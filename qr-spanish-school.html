<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QR - Bastille Spanish School</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
    h2 { margin: 0 0 8px; color: #1c1917; font-size: 20px; }
    p { margin: 0 0 24px; color: #78716c; font-size: 14px; }
    #qrcode { margin: 0 auto 24px; }
    .url { font-size: 12px; color: #a8a29e; margin: 16px 0 0; }
    button { background: #f59e0b; color: #1c1917; font-weight: 600; border: none; padding: 12px 32px; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 20px; }
    button:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🇧🇴 Bastille Spanish School</h2>
    <p>Escanea para reservar tu clase</p>
    <div id="qrcode"></div>
    <div class="url">bastillehotelsucre.com/spanish-school</div>
    <br>
    <button onclick="download()">⬇ Descargar PNG</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://www.bastillehotelsucre.com/spanish-school",
      width: 256,
      height: 256,
      colorDark: "#1c1917",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    function download() {
      setTimeout(() => {
        const canvas = document.querySelector("#qrcode canvas");
        if (canvas) {
          const link = document.createElement("a");
          link.download = "bastille-spanish-school-qr.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        }
      }, 500);
    }
  </script>
</body>
</html>
